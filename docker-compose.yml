networks:
  epiroad_network:
    driver: bridge

services:
  postgres:
    image: postgres:15
    networks:
      - epiroad_network
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

    
  redis: 
    image: redis:7
    networks:
      - epiroad_network
    ports:
      - 6379:6379

  api:
    build: ./backend
    networks:
      - epiroad_network
    ports:
      - 8000:8000
    depends_on:
      - postgres
      - redis

  # web:
  #   build: ./frontend
  #   networks:
  #     - epiroad_network
  #   ports:
  #     - 3000:3000
  #   depends_on:
  #    - api

volumes:
  postgres_data:


